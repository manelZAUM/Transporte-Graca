<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Secretaria - Gestao</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .painel-card{max-width:1200px;margin:0 auto;width:100%}.tabela-container{overflow-x:auto;margin-top:20px;border:1px solid #ddd;border-radius:8px}
    table{width:100%;border-collapse:collapse;background:#fff;font-size:.92rem}th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}th{background:#f8f9fa;text-transform:uppercase;font-size:.8rem}
    .status-badge{padding:5px 10px;border-radius:20px;font-weight:700;display:inline-block}.status-aprovado{background:#d4edda;color:#155724}.status-pendente{background:#fff3cd;color:#856404}.status-reprovado{background:#f8d7da;color:#721c24}
    .btn-acao{padding:7px 9px;margin:2px;border:1px solid #ccc;border-radius:6px;cursor:pointer;font-weight:700}.btn-editar{background:#f8f9fa;color:#333}.btn-excluir{background:#fff;color:#c82333;border-color:#c82333}
    .btn-adicionar{background:#218838;color:#fff;padding:11px 18px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.btn-sair-painel{background:#c82333!important;color:#fff!important;border:0}
    #mensagem-carregamento{text-align:center;font-size:1.1rem;color:#0056b3;padding:50px 20px;font-weight:700}.cabecalho-tabela{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
    .modal{display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,.55)}.modal-content{background:#fff;margin:4vh auto;padding:28px;border-radius:12px;width:min(500px,92%);max-height:92vh;overflow:auto}
    .form-group{margin-bottom:15px}.form-group label{display:block;font-weight:700;margin-bottom:7px}.form-group input,.form-group select{width:100%;padding:11px;border:1px solid #bbb;border-radius:6px}
    .modal-acoes{display:flex;gap:10px;margin-top:24px}.modal-acoes button{flex:1;padding:12px;border:0;border-radius:6px;cursor:pointer;font-weight:700}.btn-salvar{background:#0056b3;color:#fff}.btn-cancelar{background:#eee}
  </style>
</head>
<body>
  <header class="cabecalho-oficial">
    <div class="pill-logo" style="display:flex;align-items:center;gap:10px">
      <img src="Logo prefeitura.png" alt="Logo Prefeitura de Graca">
      <span style="font-weight:bold">Gestao de Transporte</span>
    </div>
    <button type="button" onclick="fazerLogout()" class="botaosec btn btn-sair-painel">Sair</button>
  </header>

  <main class="area-portal">
    <div class="card painel-card">
      <div id="mensagem-carregamento" role="status" aria-live="polite">Carregando a base de dados...</div>
      <div id="conteudo-painel" style="display:none">
        <div class="cabecalho-tabela">
          <div><h2>Lista geral de estudantes</h2><p>Edite alunos e gere codigos temporarios de atualizacao.</p></div>
          <button type="button" class="btn-adicionar" onclick="abrirModal()">Adicionar aluno</button>
        </div>
        <div class="tabela-container">
          <table>
            <thead><tr><th>Nome</th><th>CPF</th><th>Instituicao</th><th>Turno</th><th>Rota</th><th>Status</th><th>Acoes</th></tr></thead>
            <tbody id="corpo-tabela"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="modal-aluno" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-content">
      <h2 id="modal-titulo">Adicionar novo aluno</h2>
      <form id="form-aluno" onsubmit="salvarAluno(event)">
        <input type="hidden" id="aluno-id">
        <div class="form-group"><label for="aluno-nome">Nome completo</label><input id="aluno-nome" type="text" maxlength="150" required autocomplete="off"></div>
        <div class="form-group"><label for="aluno-cpf">CPF</label><input id="aluno-cpf" type="text" inputmode="numeric" maxlength="14" required autocomplete="off"></div>
        <div class="form-group"><label for="aluno-instituicao">Instituicao</label><input id="aluno-instituicao" type="text" maxlength="120" required autocomplete="off"></div>
        <div class="form-group">
          <label for="aluno-turno">Turno</label>
          <select id="aluno-turno" required><option value="">Selecione...</option><option value="Manha">Manha</option><option value="Tarde">Tarde</option><option value="Noite">Noite</option><option value="Integral">Integral</option></select>
        </div>
        <div class="form-group">
          <label for="aluno-onibus">Onibus/rota</label>
          <select id="aluno-onibus" required><option value="">Selecione...</option><option value="AMARELO">AMARELO</option><option value="AZUL">AZUL</option></select>
        </div>
        <div class="form-group">
          <label for="aluno-status">Status</label>
          <select id="aluno-status" required><option value="Pendente">Pendente</option><option value="Em Analise">Em Analise</option><option value="Aprovado">Aprovado</option><option value="Prioridade">Prioridade</option><option value="Reprovado">Reprovado</option></select>
        </div>
        <div class="modal-acoes"><button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button><button type="submit" class="btn-salvar">Salvar</button></div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="dashboard-secretaria-seguro.js"></script>
</body>
</html>
